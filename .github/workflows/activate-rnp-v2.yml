name: Activate RNP v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-rnp-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Switch admin RNP module
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          old = './rnp-admin.js?v=1'
          new = './rnp-admin-v2.js?v=2'
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('RNP loader reference not found')
          index.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          s = sw.read_text(encoding='utf-8')
          s = s.replace('const CACHE = "m2-mobile-v18";', 'const CACHE = "m2-mobile-v19";', 1)
          s = s.replace('"./rnp-admin.js?v=1"', '"./rnp-admin-v2.js?v=2"')
          if './rnp-admin-v2.js?v=2' not in s:
              raise SystemExit('RNP service worker reference not found')
          sw.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check rnp-admin-v2.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          match = re.search(r'<script>\n(.*?)\n</script>', text, re.S)
          if not match:
              raise SystemExit('Inline loader script not found')
          Path('/tmp/index-inline.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Activate compact RNP v2"
          git push
