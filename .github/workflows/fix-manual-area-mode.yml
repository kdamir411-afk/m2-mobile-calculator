name: Apply manual area UX fix

on:
  push:
    branches:
      - fix/manual-area-mode

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-area-mode
          fetch-depth: 0

      - name: Patch calculator
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('app.html')
          s = p.read_text()

          s = s.replace(
              "function blankFloor(){return{title:'',length:0,width:0,product:-1,discount:0}}",
              "function blankFloor(){return{title:'',area:0,product:-1,discount:0}}"
          )
          s = s.replace(
              "floorItems=floorItems.map(x=>({title:String(x.title||''),length:safe(x.length),width:safe(x.width),product:validProduct(x.product),discount:Math.min(100,safe(x.discount))}));",
              "floorItems=floorItems.map(x=>({title:String(x.title||''),area:safe(x.area||(safe(x.length)*safe(x.width))),product:validProduct(x.product),discount:Math.min(100,safe(x.discount))}));"
          )
          s = s.replace(
              "function floorCalc(x){const p=productObj(x.product),area=safe(x.length)*safe(x.width),d=Math.min(100,safe(x.discount));return{p,area,total:area*safe(p?.price)*(1-d/100)}}",
              "function floorCalc(x){const p=productObj(x.product),area=safe(x.area),d=Math.min(100,safe(x.discount));return{p,area,total:area*safe(p?.price)*(1-d/100)}}"
          )

          floor_render = '''function renderFloor(){const list=$('floorList');list.innerHTML='';floorItems.forEach((x,i)=>{const c=floorCalc(x),d=document.createElement('div');d.className='sizecard';d.innerHTML=`<div class="head"><b class="sizeTitle" data-fhead="${i}">${esc(x.title||`Расчёт ${i+1}`)}</b><div class="actions" style="margin:0"><button class="secondary" data-fdup="${i}">Дублировать</button>${floorItems.length>1?`<button class="danger" data-fdel="${i}">×</button>`:''}</div></div><label>Название (необязательно)</label><input data-ftitle="${i}" value="${esc(x.title)}"><label>Площадь, м²</label><input data-farea="${i}" type="number" step="0.01" inputmode="decimal" value="${x.area?x.area:''}" placeholder="0"><label>Товар</label><button type="button" class="productpick" data-fpick="${i}">${productText(x.product)}</button><label>Скидка, %</label><input data-fdiscount="${i}" type="number" min="0" max="100" step="0.1" inputmode="decimal" value="${x.discount?x.discount:''}" placeholder="0"><div class="dimresult"><div class="line"><span>Стоимость</span><b data-ft="${i}" class="final">${money(c.total)} ₸</b></div></div>`;list.appendChild(d)});calcFloor()}'''
          s, n = re.subn(r"function renderFloor\(\)\{.*?\}\nfunction calcFloor", floor_render + "\nfunction calcFloor", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('renderFloor patch failed')

          s = s.replace('value="${safe(x.height)}"', 'value="${x.height?x.height:\'\'}" placeholder="0"')
          s = s.replace('value="${safe(x.width)}"', 'value="${x.width?x.width:\'\'}" placeholder="0"')
          s = s.replace('value="${safe(x.discount)}"', 'value="${x.discount?x.discount:\'\'}" placeholder="0"')

          s = s.replace(
              "const p=z.productSnapshot||productObj(z.product)||{name:'',category:'',price:0},area=x.type==='wall'?safe(z.height)*safe(z.width):safe(z.length)*safe(z.width)",
              "const p=z.productSnapshot||productObj(z.product)||{name:'',category:'',price:0},area=x.type==='wall'?safe(z.height)*safe(z.width):safe(z.area)"
          )
          s = s.replace(
              "if(x.type==='wall')out.push(`Высота: ${num(z.height)} м`,`Ширина: ${num(z.width)} м`);else out.push(`Длина: ${num(z.length)} м`,`Ширина: ${num(z.width)} м`);",
              "if(x.type==='wall')out.push(`Высота: ${num(z.height)} м`,`Ширина: ${num(z.width)} м`);"
          )
          s = s.replace(
              "area=x.type==='wall'?safe(z.height)*safe(z.width):safe(z.length)*safe(z.width)",
              "area=x.type==='wall'?safe(z.height)*safe(z.width):safe(z.area)"
          )
          s = s.replace(
              '<div class="line"><span>Размер</span><b>${x.type===\'wall\'?num(z.height):num(z.length)} × ${num(z.width)} м</b></div><div class="line"><span>Площадь</span>',
              '${x.type===\'wall\'?`<div class="line"><span>Размер</span><b>${num(z.height)} × ${num(z.width)} м</b></div>`:\'\'}<div class="line"><span>Площадь</span>'
          )

          floor_events = '''$('addFloor').onclick=()=>{floorItems.push(blankFloor());persist();renderFloor()};$('floorList').oninput=e=>{const d=e.target.dataset;let i=d.ftitle??d.farea??d.fdiscount;if(i===undefined)return;i=+i;if(d.ftitle!==undefined){floorItems[i].title=e.target.value;const h=document.querySelector(`[data-fhead="${i}"]`);if(h)h.textContent=e.target.value.trim()||`Расчёт ${i+1}`}if(d.farea!==undefined)floorItems[i].area=safe(e.target.value);if(d.fdiscount!==undefined)floorItems[i].discount=Math.min(100,safe(e.target.value));persist();calcFloor()};$('floorList').onclick=e=>{const pick=e.target.closest('[data-fpick]'),del=e.target.closest('[data-fdel]'),dup=e.target.closest('[data-fdup]');if(pick){openPicker('floor',+pick.dataset.fpick);return}if(del){floorItems.splice(+del.dataset.fdel,1);if(!floorItems.length)floorItems=[blankFloor()];persist();renderFloor()}else if(dup){const i=+dup.dataset.fdup;floorItems.splice(i+1,0,{...floorItems[i],title:''});persist();renderFloor()}};$('copyFloor').onclick=()=>copy(textSnapshot(snapshot('floor')));$('saveFloor').onclick=()=>openSave(snapshot('floor'));$('clearFloor').onclick=()=>clearCurrent('floor');'''
          s, n = re.subn(r"\$\('addFloor'\)\.onclick=.*?\$\('clearFloor'\)\.onclick=\(\)=>clearCurrent\('floor'\);", floor_events, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('floor events patch failed')

          s = re.sub(r"document\.addEventListener\('focusin'.*?\);(?=persist\(\);)", '', s, count=1, flags=re.S)

          p.write_text(s)

          sw = Path('sw.js')
          sw.write_text(sw.read_text().replace('m2-mobile-v12', 'm2-mobile-v13'))

          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/app.js').write_text(s[a:b])
          PY

          node --check /tmp/app.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html sw.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix manual area mode and phantom zero inputs"
          git push origin HEAD:fix/manual-area-mode
