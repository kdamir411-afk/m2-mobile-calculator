name: Build pack calculation update

on:
  push:
    branches:
      - feature/pack-calculation
    paths:
      - .github/workflows/build-pack-calculation.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pack-calculation
          fetch-depth: 0

      - name: Assemble and verify app
        shell: bash
        run: |
          cat .tmp/app.part* > app.html
          expected="95cfb6275c2b3949b74ee8f3a02ae5902f71549f0f70632f1123bdef657573f6"
          actual="$(sha256sum app.html | awk '{print $1}')"
          test "$actual" = "$expected"
          sed -i 's/m2-mobile-v14/m2-mobile-v15/g' sw.js
          rm -rf .tmp .github/workflows/build-pack-calculation.yml

      - name: Commit finished update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Добавить расчёт упаковок и запаса"
          git push origin HEAD:feature/pack-calculation
