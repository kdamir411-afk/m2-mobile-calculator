name: Apply discount breakdown

on:
  push:
    branches:
      - fix/discount-breakdown-copy

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/discount-breakdown-copy
          fetch-depth: 0

      - name: Patch calculator output
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path('app.html')
          s=p.read_text()

          new_text_snapshot = r'''function textSnapshot(x){let out=['Расчёт заказа',''],ta=0,totalBefore=0,totalDiscount=0,totalAfter=0;(x.items||[]).forEach((z,i)=>{const p=z.productSnapshot||productObj(z.product)||{name:'',category:'',price:0},area=x.type==='wall'?safe(z.height)*safe(z.width):safe(z.area),d=Math.min(100,safe(z.discount)),base=area*safe(p.price),discount=base*d/100,total=base-discount;ta+=area;totalBefore+=base;totalDiscount+=discount;totalAfter+=total;out.push(z.title||`Размеры ${i+1}`);if(x.type==='wall')out.push(`Высота: ${num(z.height)} м`,`Ширина: ${num(z.width)} м`);out.push(`Площадь: ${num(area)} м²`,`Категория: ${p.category||NO_CAT}`,`Товар: ${p.name||'Без названия'}`,`Цена: ${money(p.price)} ₸/м²`,`Сумма: ${money(base)} ₸`);if(d)out.push(`Скидка: ${d}%`);out.push(`Итого: ${money(total)} ₸`,'')});out.push('Общая площадь: '+num(ta)+' м²');if(totalDiscount>0)out.push('Сумма до скидки: '+money(totalBefore)+' ₸','Общая скидка: '+money(totalDiscount)+' ₸');out.push('Итого: '+money(totalAfter)+' ₸');if(x.note)out.push('','Заметка: '+x.note);return out.join('\n')}'''
          s,n=re.subn(r"function textSnapshot\(x\)\{.*?\}\nasync function copy", new_text_snapshot+'\nasync function copy', s, count=1, flags=re.S)
          if n!=1: raise SystemExit('textSnapshot patch failed')

          new_show_detail = r'''function showDetail(i){const x=history[i];if(!x)return;lastTab='history';let h=`<div class="detailtitle">${esc(x.name||'Расчёт')}</div><div class="sub">${esc(x.date||'')}</div>`;if(x.note)h+=`<div class="card"><b>Заметка</b><div class="note" style="margin-top:7px">${esc(x.note)}</div></div>`;if(x.type==='floor'||x.type==='wall'){let totalBefore=0,totalDiscount=0,totalAfter=0;(x.items||[]).forEach((z,j)=>{const p=z.productSnapshot||{name:'',category:'',price:0},area=x.type==='wall'?safe(z.height)*safe(z.width):safe(z.area),d=Math.min(100,safe(z.discount)),base=area*safe(p.price),discount=base*d/100,total=base-discount;totalBefore+=base;totalDiscount+=discount;totalAfter+=total;h+=`<div class="detailitem"><b>${esc(z.title||`Размеры ${j+1}`)}</b>${x.type==='wall'?`<div class="line"><span>Размер</span><b>${num(z.height)} × ${num(z.width)} м</b></div>`:''}<div class="line"><span>Площадь</span><b>${num(area)} м²</b></div><div class="line"><span>Товар</span><b>${esc(p.name||'Без названия')}</b></div><div class="line"><span>Цена</span><b>${money(p.price)} ₸/м²</b></div><div class="line"><span>Сумма</span><b>${money(base)} ₸</b></div>${d?`<div class="line"><span>Скидка</span><b>${d}%</b></div>`:''}<div class="line"><span>Итого</span><b class="final">${money(total)} ₸</b></div></div>`});h+=`<div class="card"><div class="line"><span>Общая площадь</span><b>${num(x.area)} м²</b></div>${totalDiscount>0?`<div class="line"><span>Сумма до скидки</span><b>${money(totalBefore)} ₸</b></div><div class="line"><span>Общая скидка</span><b>${money(totalDiscount)} ₸</b></div>`:''}<div class="line"><span>Итого</span><b class="final">${money(totalAfter)} ₸</b></div></div>`}else h+='<div class="card small">Старая запись сохранена в прежнем формате.</div>';h+=`<div class="actions"><button class="secondary" data-copyhist="${i}">Скопировать</button><button class="danger" data-delhist="${i}">Удалить</button></div>`;$('detailContent').innerHTML=h;document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));$('detailScreen').classList.add('active');$('bottomNav').classList.add('hidden');window.scrollTo(0,0)}'''
          s,n=re.subn(r"function showDetail\(i\)\{.*?\}function clearCurrent", new_show_detail+'function clearCurrent', s, count=1, flags=re.S)
          if n!=1: raise SystemExit('showDetail patch failed')

          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text()
          t=re.sub(r'm2-mobile-v\d+', 'm2-mobile-v14', t, count=1)
          sw.write_text(t)

          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/app.js').write_text(s[a:b])
          PY

          node --check /tmp/app.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html sw.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Show original totals and combined discount"
          git push origin HEAD:fix/discount-breakdown-copy
