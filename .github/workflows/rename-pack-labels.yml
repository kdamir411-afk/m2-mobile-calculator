name: Rename pack calculation labels

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rename-pack-labels.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rename labels and bump cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Площадь с запасом', 'Нужно с запасом')
          s = s.replace('Фактический метраж', 'Метраж в упаковках')
          p.write_text(s, encoding='utf-8')
          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8').replace('m2-mobile-v15', 'm2-mobile-v16')
          sw.write_text(t, encoding='utf-8')
          PY
          rm -f .github/workflows/rename-pack-labels.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Переименовать показатели расчёта упаковок"
          git push origin HEAD:main
