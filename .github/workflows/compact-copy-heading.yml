name: Compact copied product heading

on:
  push:
    branches:
      - feature/compact-copy-product-heading-v2
    paths:
      - .github/workflows/compact-copy-heading.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compact-copy-product-heading-v2
          fetch-depth: 0

      - name: Patch copied calculation text
        shell: python
        run: |
          from pathlib import Path
          path = Path('app.html')
          text = path.read_text(encoding='utf-8')
          old = "out.push(z.title||`Размеры ${i+1}`);if(x.type==='wall')out.push(`Высота: ${num(z.height)} м`,`Ширина: ${num(z.width)} м`);out.push(`Площадь: ${num(c.area)} м²`,`Укладка: ${layoutLabel(c.layout)}`,`Запас: ${c.waste}%`,`Нужно с запасом: ${num(c.wasteArea)} м²`,`Категория: ${p.category||NO_CAT}`,`Товар: ${p.name||'Без названия'}`,`Цена: ${money(p.price)} ₸/м²`);"
          new = "const productHeading=`${p.category||NO_CAT} — ${p.name||'Без названия'}`;out.push(z.title?`${z.title} · ${productHeading}`:productHeading);if(x.type==='wall')out.push(`Высота: ${num(z.height)} м`,`Ширина: ${num(z.width)} м`);out.push(`Площадь: ${num(c.area)} м²`,`Укладка: ${layoutLabel(c.layout)}`,`Запас: ${c.waste}%`,`Нужно с запасом: ${num(c.wasteArea)} м²`,`Цена: ${money(p.price)} ₸/м²`);"
          if old not in text:
              raise SystemExit('Target text not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8').replace('m2-mobile-v16','m2-mobile-v17',1)
          sw.write_text(sw_text, encoding='utf-8')

          Path('.github/workflows/compact-copy-heading.yml').unlink()

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Сделать заголовок товара в копируемом расчёте"
          git push origin HEAD:feature/compact-copy-product-heading-v2
