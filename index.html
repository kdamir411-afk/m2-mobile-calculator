<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Калькулятор м²</title>
<style>
:root{--bg:#0d0d0f;--card:#17171b;--card2:#202026;--text:#f5f5f7;--muted:#9a9aa3;--border:#303038;--red:#ff6868}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh}.locked body{overflow:hidden}#accessGate{position:fixed;z-index:9999;inset:0;background:var(--bg);display:flex;justify-content:center;overflow:auto;padding:calc(32px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}.gatewrap{width:min(430px,100%);margin:auto}.gatelogo{width:64px;height:64px;border-radius:20px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;margin-bottom:22px}#gateTitle{font-size:30px;margin:0 0 8px}.gatesub{color:var(--muted);line-height:1.45;margin-bottom:24px}#gateBody input{width:100%;height:52px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:14px;padding:0 14px;font-size:16px;outline:none;margin-bottom:10px}#gateBody button{width:100%;min-height:50px;border:0;border-radius:14px;padding:11px 14px;font-size:15px;font-weight:700;margin-top:8px}.gateprimary{background:#fff;color:#111}.gatelink{background:transparent!important;color:var(--muted)!important}.gateerror{color:#ff8c8c;font-size:13px;margin-top:10px}.waitdot{text-align:center;font-size:34px;letter-spacing:7px;color:var(--muted);padding:10px}
</style>
</head>
<body>
<script>
window.__loadCalculator=async function(){
  try{
    const r=await fetch('https://raw.githubusercontent.com/kdamir411-afk/m2-mobile-calculator/b6799217619d0fab7a2925aa1538deefbab11ba4/index.html',{cache:'no-store'});
    if(!r.ok)throw new Error('load');
    let html=await r.text();
    html=html.replace('placeholder="Например: Дамир 6303"','placeholder=""');

    if(localStorage.getItem('m2_admin_token')){
      html=html.replace('</style>',`.navinner{grid-template-columns:repeat(4,1fr)!important}.adminrow{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:14px;margin-bottom:10px}.adminrowtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.adminmeta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}.adminbadge{font-size:11px;color:var(--muted);white-space:nowrap}.adminactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.adminactions button{min-height:40px;padding:9px 12px}.adminempty{text-align:center;color:var(--muted);padding:28px 8px}.admintop{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}</style>`);
      html=html.replace('</main>',`<section id="accessScreen" class="screen"><h1>Доступ</h1><div class="sub">Заявки и разрешённые устройства.</div><div class="admintop"><button id="adminRefresh" class="secondary">Обновить</button><button id="adminLogout" class="danger">Выйти из аккаунта</button></div><div id="adminAccessList"><div class="adminempty">Загрузка…</div></div></section></main>`);
      html=html.replace('</div></nav>',`<button class="navbtn" data-tab="access"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.6-2.9 8-7 10-4.1-2-7-5.4-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg><span>Доступ</span></button></div></nav>`);
      const adminJs=`<script>(()=>{'use strict';const BASE='https://ridsvuikibgymficcwnx.supabase.co',KEY='sb_publishable_6Lbp2cPS6yQ-Ph2LyKi28g__zNnhMys',ADMIN_KEY='m2_admin_token';const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function rpc(name,body){const r=await fetch(BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();let d=null;if(t){try{d=JSON.parse(t)}catch{d=t}}if(!r.ok)throw new Error('rpc');return d}function statusName(s){return s==='pending'?'Ожидает':s==='approved'?'Разрешён':s==='rejected'?'Отклонён':'Отключён'}async function loadAccess(){const box=document.getElementById('adminAccessList'),token=localStorage.getItem(ADMIN_KEY);if(!box||!token)return;box.innerHTML='<div class="adminempty">Загрузка…</div>';try{const rows=await rpc('admin_access_requests',{p_token:token});if(!rows||!rows.length){box.innerHTML='<div class="adminempty">Заявок пока нет</div>';return}box.innerHTML=rows.map(x=>{const actions=x.status==='approved'?'<button class="danger" data-status="revoked" data-id="'+x.id+'">Отключить</button>':'<button data-status="approved" data-id="'+x.id+'">Разрешить</button>'+(x.status==='pending'?'<button class="secondary" data-status="rejected" data-id="'+x.id+'">Отклонить</button>':'');return '<div class="adminrow"><div class="adminrowtop"><div><b>'+esc(x.name)+'</b><div class="adminmeta">'+new Date(x.created_at).toLocaleString('ru-RU')+'</div></div><span class="adminbadge">'+statusName(x.status)+'</span></div><div class="adminactions">'+actions+'</div></div>'}).join('')}catch(e){localStorage.removeItem(ADMIN_KEY);location.reload()}}function showAccess(){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));const s=document.getElementById('accessScreen');if(s)s.classList.add('active');document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab==='access'));loadAccess()}const ab=document.querySelector('[data-tab="access"]');if(ab)ab.addEventListener('click',()=>setTimeout(showAccess,0));document.querySelectorAll('.navbtn:not([data-tab="access"])').forEach(b=>b.addEventListener('click',()=>{const s=document.getElementById('accessScreen');if(s)s.classList.remove('active')}));const box=document.getElementById('adminAccessList');if(box)box.addEventListener('click',async e=>{const b=e.target.closest('[data-id][data-status]');if(!b)return;b.disabled=true;try{await rpc('admin_set_access',{p_token:localStorage.getItem(ADMIN_KEY),p_request_id:b.dataset.id,p_status:b.dataset.status});await loadAccess()}catch(e){b.disabled=false}});const refresh=document.getElementById('adminRefresh');if(refresh)refresh.onclick=loadAccess;const logout=document.getElementById('adminLogout');if(logout)logout.onclick=()=>{localStorage.removeItem(ADMIN_KEY);location.reload()}})();<\/script>`;
      html=html.replace('</body>',adminJs+'</body>');
    }

    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div style="padding:30px;color:#fff;font-family:-apple-system,sans-serif">Не удалось загрузить калькулятор. Проверьте интернет и откройте приложение снова.</div>'}
};
document.addEventListener('m2-access-granted',()=>window.__loadCalculator(),{once:true});
</script>
<script src="access.js?v=4"></script>
</body>
</html>
