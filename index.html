<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Калькулятор м²</title>
<style>
:root{--bg:#0d0d0f;--card:#17171b;--card2:#202026;--text:#f5f5f7;--muted:#9a9aa3;--border:#2d2d35;--good:#8ee6a5;--red:#ff6868}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}main{max-width:720px;margin:auto;padding:18px 0 34px}h1{font-size:28px;margin:0 0 6px}.sub,.small{color:var(--muted);font-size:13px;line-height:1.4}.sub{margin-bottom:18px}.card,.sizecard{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:14px}.sizecard{background:var(--card2);margin:10px 0}.head,.line{display:flex;justify-content:space-between;align-items:center;gap:10px}.line{margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;color:var(--muted);margin:7px 0}input,select{width:100%;min-height:48px;border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:13px;padding:11px;font-size:16px;outline:none}.sizecard input,.sizecard select{background:#17171b}.big{font-size:24px;font-weight:700}.final{color:var(--good);font-size:19px;font-weight:700}.result,.historyrow{padding:13px 0;border-bottom:1px solid var(--border)}.result:last-child,.historyrow:last-child{border:0}.pname{font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:12px;padding:11px 13px;min-height:42px;font-size:14px;font-weight:650;background:#fff;color:#111}.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}.danger{background:transparent;color:#ff8c8c;border:1px solid var(--border)}.trash{width:44px;min-width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,80,80,.08);color:var(--red);border:1px solid rgba(255,104,104,.28)}.trash svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.hidden{display:none!important}details{border-top:1px solid var(--border);margin-top:12px;padding-top:7px}summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:650}summary::-webkit-details-marker{display:none}.switchrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.switchrow input{width:24px;min-height:24px}.editor{display:grid;grid-template-columns:minmax(0,1fr) 105px 42px;gap:6px;margin:8px 0}.historyrow{cursor:pointer}.historyrow:active{opacity:.7}.detailtop{display:flex;align-items:center;gap:10px;margin-bottom:16px}.detailitem{background:var(--card2);border-radius:15px;padding:13px;margin:10px 0}.detailitem h3{margin:0 0 10px}.detailtitle{font-size:25px;font-weight:750}.count{font-size:12px;color:var(--muted);font-weight:400}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}.search{margin-top:12px}.note{white-space:pre-wrap;margin-top:8px}@media(max-width:430px){.editor{grid-template-columns:minmax(0,1fr) 95px 40px}}
</style></head><body><main><div id="appscreen"><h1>Калькулятор м²</h1><div class="sub">Расчёт площади, материалов и стоимости заказа.</div>
<section class="card"><div id="manual" class="grid2"><div><label>Сколько м² нужно?</label><input id="area" type="number" min="0" step="0.01" inputmode="decimal" placeholder="25"></div><div><label>Скидка, %</label><input id="discount" type="number" min="0" max="100" step="0.1" inputmode="decimal" placeholder="10"></div></div><div id="sizes" class="hidden"><div id="sizelist"></div><button id="addsize" class="secondary">+ Добавить размер</button><div class="line"><span>Общая площадь</span><b id="sizearea">0 м²</b></div><div class="line"><span>Общая стоимость</span><b id="sizetotal" class="final">0 ₸</b></div><div class="toolbar"><button id="copysizes" class="secondary">Скопировать расчёт</button><button id="savesizes">Сохранить в историю</button><button id="trashsizes" class="trash" aria-label="Очистить расчёт"></button></div></div><details><summary>Настройки расчёта <span>⌄</span></summary><div class="switchrow"><div><b>Считать по высоте × ширине</b><div class="small">Каждому размеру можно дать название, материал и скидку.</div></div><input id="mode" type="checkbox"></div></details></section>
<section class="card" id="manualresults"><div class="head"><div><div class="small">Общая площадь</div><div id="areaview" class="big">0 м²</div></div></div><div id="results"></div><div class="toolbar"><button id="copymanual" class="secondary">Скопировать расчёт</button><button id="savemanual">Сохранить расчёт</button><button id="trashmanual" class="trash" aria-label="Очистить расчёт"></button></div></section>
<section class="card"><details id="productsbox"><summary><span>Товары и цены <span id="count" class="count"></span></span><span>⌄</span></summary><div id="editor"></div><div class="toolbar"><button id="addproduct" class="secondary">+ Добавить товар</button><button id="saveproducts">Сохранить</button></div></details></section>
<section class="card"><div class="head"><b style="font-size:20px">История расчётов</b><span id="historycount" class="count"></span></div><input id="historysearch" class="search" type="search" placeholder="Поиск по имени или заметке"><div id="history"></div></section><div class="footer">Данные сохраняются на этом устройстве.</div></div><div id="detailscreen" class="hidden"><div class="detailtop"><button id="back" class="secondary">← Назад</button></div><div id="detailcontent"></div></div></main>
<script>(()=>{const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n),num=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n),safe=v=>{let n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)?Math.max(0,n):0},esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),trash='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 10v6M14 10v6"/></svg>';
$('trashmanual').innerHTML=trash;$('trashsizes').innerHTML=trash;let products;try{products=JSON.parse(localStorage.getItem('m2_products'))}catch{}if(!Array.isArray(products)||!products.length)products=[{name:'Товар 1',price:18700}];products=products.map((p,i)=>({name:p.name||`Товар ${i+1}`,price:safe(p.price)}));let sizes;try{sizes=JSON.parse(localStorage.getItem('m2_walls_v2'))}catch{}function blankSize(){return{title:'',height:0,width:0,product:0,discount:0}}if(!Array.isArray(sizes)||!sizes.length)sizes=[blankSize()];sizes=sizes.map(x=>({...x,title:x.title||x.label||''}));let history;try{history=JSON.parse(localStorage.getItem('m2_history'))}catch{}if(!Array.isArray(history))history=[];const area=$('area'),discount=$('discount'),mode=$('mode'),sizelist=$('sizelist'),editor=$('editor');mode.checked=localStorage.getItem('m2_dimension_mode')==='1';discount.value=localStorage.getItem('m2_discount')||'';
function saveSizes(){localStorage.setItem('m2_walls_v2',JSON.stringify(sizes))}function saveProducts(){localStorage.setItem('m2_products',JSON.stringify(products))}function saveHistory(){localStorage.setItem('m2_history',JSON.stringify(history))}function readEditor(){products=products.map((p,i)=>({name:(editor.querySelector(`[data-n="${i}"]`)?.value||`Товар ${i+1}`).trim()||`Товар ${i+1}`,price:safe(editor.querySelector(`[data-p="${i}"]`)?.value)}))}function renderEditor(){editor.innerHTML='';products.forEach((p,i)=>{let d=document.createElement('div');d.className='editor';d.innerHTML=`<input data-n="${i}" value="${esc(p.name)}"><input data-p="${i}" type="number" inputmode="decimal" value="${p.price||''}" placeholder="₸/м²"><button data-rp="${i}" class="danger">×</button>`;editor.appendChild(d)});$('count').textContent=`· ${products.length}`}function opts(sel){return products.map((p,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(p.name)} — ${money(p.price)} ₸/м²</option>`).join('')}function sizeCalc(x){let a=safe(x.height)*safe(x.width),p=products[x.product]||products[0]||{name:'Товар',price:0},base=a*p.price,d=Math.min(100,safe(x.discount)),cut=base*d/100;return{area:a,p,d,cut,total:base-cut}}
function renderSizes(){sizelist.innerHTML='';sizes.forEach((x,i)=>{let c=sizeCalc(x),d=document.createElement('div');d.className='sizecard';d.innerHTML=`<div class="head"><b data-head="${i}">${esc(x.title.trim()||`Размер ${i+1}`)}</b><div class="toolbar" style="margin:0"><button class="secondary" data-dup="${i}">Дублировать</button>${sizes.length>1?`<button class="danger" data-rs="${i}">Удалить</button>`:''}</div></div><label>Название (необязательно)</label><input data-title="${i}" value="${esc(x.title)}"><div class="grid2"><div><label>Высота, м</label><input data-h="${i}" type="number" step="0.01" inputmode="decimal" value="${x.height||''}"></div><div><label>Ширина, м</label><input data-w="${i}" type="number" step="0.01" inputmode="decimal" value="${x.width||''}"></div></div><label>Материал</label><select data-m="${i}">${opts(x.product)}</select><label>Скидка для этого размера, %</label><input data-d="${i}" type="number" min="0" max="100" step="0.1" inputmode="decimal" value="${x.discount||''}"><div class="line small"><span>Площадь</span><b data-sa="${i}">${num(c.area)} м²</b></div><div class="line"><span>Стоимость</span><b data-st="${i}" class="final">${money(c.total)} ₸</b></div>`;sizelist.appendChild(d)});calcSizes()}function calcSizes(){let a=0,cut=0,total=0;sizes.forEach((x,i)=>{let c=sizeCalc(x);a+=c.area;cut+=c.cut;total+=c.total;let ae=sizelist.querySelector(`[data-sa="${i}"]`),te=sizelist.querySelector(`[data-st="${i}"]`);if(ae)ae.textContent=num(c.area)+' м²';if(te)te.textContent=money(c.total)+' ₸'});$('sizearea').textContent=num(a)+' м²';$('sizetotal').textContent=money(total)+' ₸';return{area:a,cut,total}}
function manualCalc(){let a=safe(area.value),d=Math.min(100,safe(discount.value));localStorage.setItem('m2_discount',d||'');$('areaview').textContent=num(a)+' м²';$('results').innerHTML='';products.forEach(p=>{let total=a*p.price*(1-d/100),r=document.createElement('div');r.className='result';r.innerHTML=`<div class="pname">${esc(p.name)}</div><div class="small">${money(p.price)} ₸ / м²${d?` · скидка ${d}%`:''}</div><div class="line"><span>Итого</span><b class="final">${a&&p.price?money(total)+' ₸':'—'}</b></div>`;$('results').appendChild(r)})}function manualAreaSnapshot(){let a=safe(area.value),d=Math.min(100,safe(discount.value));return{type:'manualarea',area:a,discount:d,products:products.map(p=>({name:p.name,price:p.price,total:a*p.price*(1-d/100)}))}}function textManualArea(x){let s=['Расчёт по площади','','Площадь: '+num(x.area)+' м²'];if(x.discount)s.push('Скидка: '+x.discount+'%');(x.products||[]).forEach(p=>s.push('',p.name,`Цена: ${money(p.price)} ₸/м²`,`Итого: ${money(p.total)} ₸`));if(x.note)s.push('','Заметка: '+x.note);return s.join('\n')}function sizeSnapshot(){return{type:'sizes',sizes:sizes.map(x=>({...x,productSnapshot:{...(products[x.product]||products[0])}})),...calcSizes()}}function textSizes(x){let s=['Расчёт заказа',''],ta=0,tc=0,tt=0;(x.sizes||x.walls||[]).forEach((w,i)=>{let p=w.productSnapshot||products[w.product]||{name:'Товар',price:0},a=safe(w.height)*safe(w.width),base=a*safe(p.price),d=Math.min(100,safe(w.discount)),cut=base*d/100,total=base-cut,title=(w.title||w.label||'').trim()||`Размер ${i+1}`;ta+=a;tc+=cut;tt+=total;s.push(title,`Высота: ${num(w.height)} м`,`Ширина: ${num(w.width)} м`,`Площадь: ${num(a)} м²`,`Материал: ${p.name}`,`Цена: ${money(p.price)} ₸/м²`);if(d)s.push(`Скидка: ${d}%`,`Сумма скидки: −${money(cut)} ₸`);s.push(`Стоимость: ${money(total)} ₸`,'')});s.push('Общий расчёт','Общая площадь: '+num(ta)+' м²');if(tc)s.push('Общая скидка: −'+money(tc)+' ₸');s.push('Итого: '+money(tt)+' ₸');if(x.note)s.push('','Заметка: '+x.note);return s.join('\n')}async function copyText(t){try{await navigator.clipboard.writeText(t)}catch{let x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}alert('Расчёт скопирован')}
function addHistory(item){let n=prompt('Имя клиента / название расчёта:','Клиент');if(n===null)return;let note=prompt('Заметка (необязательно):','');item.id=Date.now();item.name=n.trim()||'Клиент';item.note=(note||'').trim();item.date=new Date().toLocaleString('ru-RU');history.unshift(item);saveHistory();renderHistory();setTimeout(()=>{if(confirm('Расчёт сохранён. Начать новый расчёт?'))resetCurrent(false)},50)}function norm(x){if(x.type==='walls')return{...x,type:'sizes',sizes:x.walls};return x}function summaryOf(raw){let x=norm(raw);if(x.type==='sizes'){let a=0,t=0;(x.sizes||[]).forEach(w=>{let p=w.productSnapshot||products[w.product]||{price:0},ar=safe(w.height)*safe(w.width),base=ar*safe(p.price);a+=ar;t+=base*(1-Math.min(100,safe(w.discount))/100)});return{area:a,total:t}}if(x.type==='manualarea')return{area:safe(x.area),count:(x.products||[]).length};if(x.product)return{area:safe(x.area),total:safe(x.total)};return{area:null}}
function renderHistory(){let h=$('history'),q=$('historysearch').value.trim().toLowerCase();$('historycount').textContent=history.length?'· '+history.length:'';h.innerHTML='';let shown=0;history.forEach((raw,i)=>{let x=norm(raw),hay=((x.name||'')+' '+(x.note||'')).toLowerCase();if(q&&!hay.includes(q))return;shown++;let s=summaryOf(x),d=document.createElement('div');d.className='historyrow';d.dataset.open=i;let meta=s.area===null?'':x.type==='manualarea'?`${num(s.area)} м² · ${s.count} товаров`:`${num(s.area)} м² · ${money(s.total)} ₸`;d.innerHTML=`<div class="head"><div><div class="pname">${esc(x.name||'Расчёт')}</div><div class="small">${esc(x.date||'')}</div></div><b>›</b></div><div class="small" style="margin-top:6px">${meta}</div>${x.note?`<div class="small">${esc(x.note)}</div>`:''}`;h.appendChild(d)});if(!shown)h.innerHTML='<div class="small" style="margin-top:12px">Пока пусто.</div>'}
function showDetail(i){let x=norm(history[i]);if(!x)return,html='';let html=`<div class="detailtitle">${esc(x.name||'Расчёт')}</div><div class="sub">${esc(x.date||'')}</div>`;if(x.note)html+=`<div class="card"><b>Заметка</b><div class="note">${esc(x.note)}</div></div>`;if(x.type==='manualarea'){html+=`<div class="card"><div class="line"><span>Площадь</span><b>${num(x.area)} м²</b></div>${x.discount?`<div class="line"><span>Скидка</span><b>${x.discount}%</b></div>`:''}</div>`;(x.products||[]).forEach(p=>html+=`<div class="detailitem"><h3>${esc(p.name)}</h3><div class="line"><span>Цена</span><b>${money(p.price)} ₸/м²</b></div><div class="line"><span>Итого</span><b class="final">${money(p.total)} ₸</b></div></div>`)}else if(x.type==='sizes'){(x.sizes||[]).forEach((w,j)=>{let p=w.productSnapshot||products[w.product]||{name:'Товар',price:0},a=safe(w.height)*safe(w.width),base=a*safe(p.price),disc=Math.min(100,safe(w.discount)),total=base*(1-disc/100);html+=`<div class="detailitem"><h3>${esc((w.title||w.label||'').trim()||`Размер ${j+1}`)}</h3><div class="line"><span>Высота</span><b>${num(w.height)} м</b></div><div class="line"><span>Ширина</span><b>${num(w.width)} м</b></div><div class="line"><span>Площадь</span><b>${num(a)} м²</b></div><div class="line"><span>Материал</span><b>${esc(p.name)}</b></div><div class="line"><span>Цена</span><b>${money(p.price)} ₸/м²</b></div>${disc?`<div class="line"><span>Скидка</span><b>${disc}%</b></div>`:''}<div class="line"><span>Стоимость</span><b class="final">${money(total)} ₸</b></div></div>`})}else if(x.product){html+=`<div class="detailitem"><div class="line"><span>Площадь</span><b>${num(x.area)} м²</b></div><div class="line"><span>Материал</span><b>${esc(x.product.name)}</b></div></div>`}else html+='<div class="detailitem small">Старая запись.</div>';html+=`<div class="toolbar"><button data-dload="${i}">Загрузить расчёт</button><button class="secondary" data-dcopy="${i}">Скопировать</button><button class="danger" data-ddel="${i}">Удалить</button></div>`;$('detailcontent').innerHTML=html;$('appscreen').classList.add('hidden');$('detailscreen').classList.remove('hidden');window.scrollTo(0,0)}function closeDetail(){$('detailscreen').classList.add('hidden');$('appscreen').classList.remove('hidden')}
function loadHistory(i){let x=norm(history[i]);if(x.type==='sizes'){sizes=(x.sizes||[]).map(w=>{let p=w.productSnapshot||{},pi=products.findIndex(q=>q.name===p.name);return{title:w.title||w.label||'',height:safe(w.height),width:safe(w.width),discount:safe(w.discount),product:pi>=0?pi:0}});mode.checked=true;saveSizes();renderSizes()}else if(x.type==='manualarea'||x.product){area.value=x.area||'';discount.value=x.discount||'';mode.checked=false}sync();closeDetail();window.scrollTo(0,0)}function resetCurrent(ask=true){if(ask&&!confirm('Очистить текущий расчёт?'))return;if(mode.checked){sizes=[blankSize()];saveSizes();renderSizes()}else{area.value='';discount.value='';localStorage.setItem('m2_discount','');manualCalc()}window.scrollTo({top:0,behavior:'smooth'})}function sync(){let m=mode.checked;$('manual').classList.toggle('hidden',m);$('manualresults').classList.toggle('hidden',m);$('sizes').classList.toggle('hidden',!m);localStorage.setItem('m2_dimension_mode',m?'1':'0');m?calcSizes():manualCalc()}
area.oninput=manualCalc;discount.oninput=manualCalc;mode.onchange=sync;$('historysearch').oninput=renderHistory;$('addsize').onclick=()=>{sizes.push(blankSize());saveSizes();renderSizes()};sizelist.oninput=e=>{let k=e.target.dataset;if(k.title!==undefined){let i=+k.title;sizes[i].title=e.target.value;saveSizes();let h=sizelist.querySelector(`[data-head="${i}"]`);if(h)h.textContent=e.target.value.trim()||`Размер ${i+1}`;return}let idx=k.h??k.w??k.d;if(idx===undefined)return;idx=+idx;if(k.h!==undefined)sizes[idx].height=safe(e.target.value);if(k.w!==undefined)sizes[idx].width=safe(e.target.value);if(k.d!==undefined)sizes[idx].discount=Math.min(100,safe(e.target.value));saveSizes();calcSizes()};sizelist.onchange=e=>{if(e.target.dataset.m!==undefined){sizes[+e.target.dataset.m].product=+e.target.value;saveSizes();calcSizes()}};sizelist.onclick=e=>{let del=e.target.closest('[data-rs]'),dup=e.target.closest('[data-dup]');if(del){sizes.splice(+del.dataset.rs,1);if(!sizes.length)sizes=[blankSize()];saveSizes();renderSizes()}else if(dup){let i=+dup.dataset.dup;sizes.splice(i+1,0,{...sizes[i],title:sizes[i].title?`${sizes[i].title} копия`:''});saveSizes();renderSizes()}};editor.oninput=()=>{readEditor();manualCalc()};editor.onclick=e=>{let b=e.target.closest('[data-rp]');if(!b)return;readEditor();products.splice(+b.dataset.rp,1);if(!products.length)products=[{name:'Товар 1',price:0}];saveProducts();renderEditor();renderSizes();manualCalc()};$('addproduct').onclick=()=>{readEditor();products.push({name:`Товар ${products.length+1}`,price:0});renderEditor()};$('saveproducts').onclick=()=>{readEditor();saveProducts();renderEditor();renderSizes();manualCalc();$('productsbox').open=false};$('copymanual').onclick=()=>copyText(textManualArea(manualAreaSnapshot()));$('savemanual').onclick=()=>addHistory(manualAreaSnapshot());$('trashmanual').onclick=()=>resetCurrent(true);$('copysizes').onclick=()=>copyText(textSizes(sizeSnapshot()));$('savesizes').onclick=()=>addHistory(sizeSnapshot());$('trashsizes').onclick=()=>resetCurrent(true);$('history').onclick=e=>{let r=e.target.closest('[data-open]');if(r)showDetail(+r.dataset.open)};$('back').onclick=closeDetail;$('detailcontent').onclick=e=>{let l=e.target.closest('[data-dload]'),c=e.target.closest('[data-dcopy]'),d=e.target.closest('[data-ddel]');if(l)loadHistory(+l.dataset.dload);if(c){let x=norm(history[+c.dataset.dcopy]);copyText(x.type==='sizes'?textSizes(x):x.type==='manualarea'?textManualArea(x):x.text||'')}if(d&&confirm('Удалить этот расчёт?')){history.splice(+d.dataset.ddel,1);saveHistory();renderHistory();closeDetail()}};renderEditor();renderSizes();renderHistory();sync();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();</script></body></html>
