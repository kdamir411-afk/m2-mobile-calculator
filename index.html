<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Калькулятор м²</title><style>:root{--bg:#0d0d0f;--card:#17171b;--card2:#202026;--text:#f5f5f7;--muted:#9a9aa3;--border:#2d2d35;--good:#8ee6a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}main{max-width:720px;margin:auto;padding:18px 0 34px}h1{font-size:28px;margin:0 0 6px}.sub,.hint,.small{color:var(--muted);font-size:13px;line-height:1.4}.sub{margin-bottom:18px}.card,.wall{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:14px}.wall{background:var(--card2);margin:10px 0}.wallhead,.totalarea{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1.3fr .7fr;gap:10px}label{display:block;font-size:13px;color:var(--muted);margin:7px 0}input,select{width:100%;min-height:48px;border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:13px;padding:11px;font-size:16px;outline:none}.wall select,.wall input{background:#17171b}.big{font-size:24px;font-weight:700}.final{color:var(--good);font-size:19px;font-weight:700}.line{display:flex;justify-content:space-between;gap:10px;margin-top:8px}.result{padding:13px 0;border-bottom:1px solid var(--border)}.result:last-child{border:0}.pname{font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:12px;padding:11px 13px;min-height:42px;font-size:14px;font-weight:600;background:#fff;color:#111}.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}.danger{background:transparent;color:#ff8c8c;border:1px solid var(--border);min-height:36px;padding:7px 10px}.hidden{display:none!important}details{border-top:1px solid var(--border);margin-top:12px;padding-top:7px}summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:650}summary::-webkit-details-marker{display:none}.switchrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.switchrow input{width:24px;min-height:24px}.editor{display:grid;grid-template-columns:minmax(0,1fr) 105px 42px;gap:6px;margin:8px 0}.history{padding:12px 0;border-bottom:1px solid var(--border)}.history:last-child{border:0}.count{font-size:12px;color:var(--muted);font-weight:400}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}@media(max-width:430px){.grid2,.grid3{grid-template-columns:1fr 1fr}.editor{grid-template-columns:minmax(0,1fr) 95px 40px}}</style></head><body><main><h1>Калькулятор м²</h1><div class="sub">Расчёт площади, материалов и стоимости заказа.</div><section class="card"><div id="manual" class="grid2"><div><label>Сколько м² нужно?</label><input id="area" type="number" min="0" step="0.01" inputmode="decimal" placeholder="25"></div><div><label>Скидка, %</label><input id="discount" type="number" min="0" max="100" step="0.1" inputmode="decimal" placeholder="10"></div></div><div id="walls" class="hidden"><div id="walllist"></div><button id="addwall" class="secondary">+ Добавить стену</button><div class="totalarea"><span>Общая площадь</span><b id="wallarea">0 м²</b></div><div class="line"><span>Общая стоимость</span><b id="walltotal" class="final">0 ₸</b></div></div><details><summary>Настройки расчёта <span>⌄</span></summary><div class="switchrow"><div><b>Считать по высоте × ширине</b><div class="small">У каждой стены можно выбрать свой материал и скидку.</div></div><input id="mode" type="checkbox"></div></details></section><section class="card" id="manualresults"><div class="small">Общая площадь</div><div id="areaview" class="big">0 м²</div><div id="results"></div></section><section class="card"><details id="productsbox"><summary><span>Товары и цены <span id="count" class="count"></span></span><span>⌄</span></summary><div id="editor"></div><div class="toolbar"><button id="addproduct" class="secondary">+ Добавить товар</button><button id="saveproducts">Сохранить</button></div></details></section><section class="card"><details id="historybox"><summary><span>История расчётов <span id="historycount" class="count"></span></span><span>⌄</span></summary><div id="history"></div></details></section><div class="footer">Данные сохраняются на этом устройстве.</div></main><script>(()=>{const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n),num=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n),safe=v=>{let n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)?Math.max(0,n):0},esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let products;try{products=JSON.parse(localStorage.getItem('m2_products'))}catch{}if(!Array.isArray(products)||!products.length)products=[{name:'Товар 1',price:18700}];products=products.map((p,i)=>({name:p.name||`Товар ${i+1}`,price:safe(p.price)}));let walls;try{walls=JSON.parse(localStorage.getItem('m2_walls_v2'))}catch{}if(!Array.isArray(walls)||!walls.length)walls=[{height:0,width:0,product:0,discount:0}];let history;try{history=JSON.parse(localStorage.getItem('m2_history'))}catch{}if(!Array.isArray(history))history=[];const area=$('area'),discount=$('discount'),mode=$('mode'),walllist=$('walllist'),editor=$('editor');mode.checked=localStorage.getItem('m2_dimension_mode')==='1';discount.value=localStorage.getItem('m2_discount')||'';function saveWalls(){localStorage.setItem('m2_walls_v2',JSON.stringify(walls))}function saveProducts(){localStorage.setItem('m2_products',JSON.stringify(products))}function saveHistory(){localStorage.setItem('m2_history',JSON.stringify(history))}function readEditor(){products=products.map((p,i)=>({name:(editor.querySelector(`[data-n="${i}"]`)?.value||`Товар ${i+1}`).trim()||`Товар ${i+1}`,price:safe(editor.querySelector(`[data-p="${i}"]`)?.value)}))}function renderEditor(){editor.innerHTML='';products.forEach((p,i)=>{let d=document.createElement('div');d.className='editor';d.innerHTML=`<input data-n="${i}" value="${esc(p.name)}"><input data-p="${i}" type="number" inputmode="decimal" value="${p.price||''}" placeholder="₸/м²"><button data-rp="${i}" class="danger">×</button>`;editor.appendChild(d)});$('count').textContent=`· ${products.length}`}function options(sel){return products.map((p,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(p.name)} — ${money(p.price)} ₸/м²</option>`).join('')}function wallCalc(w){let a=safe(w.height)*safe(w.width),p=products[w.product]||products[0]||{name:'Товар',price:0},base=a*p.price,d=Math.min(100,safe(w.discount)),cut=base*d/100;return{area:a,p,base,discount:d,cut,total:base-cut}}function renderWalls(){walllist.innerHTML='';walls.forEach((w,i)=>{let c=wallCalc(w),d=document.createElement('div');d.className='wall';d.innerHTML=`<div class="wallhead"><b>Стена ${i+1}</b>${walls.length>1?`<button class="danger" data-rw="${i}">Удалить</button>`:''}</div><div class="grid2"><div><label>Высота, м</label><input data-h="${i}" type="number" step="0.01" inputmode="decimal" value="${w.height||''}" placeholder="2.7"></div><div><label>Ширина, м</label><input data-w="${i}" type="number" step="0.01" inputmode="decimal" value="${w.width||''}" placeholder="4"></div></div><label>Материал</label><select data-m="${i}">${options(w.product)}</select><label>Скидка для этой стены, %</label><input data-d="${i}" type="number" min="0" max="100" step="0.1" inputmode="decimal" value="${w.discount||''}" placeholder="0"><div class="line small"><span>Площадь</span><b data-wa="${i}">${num(c.area)} м²</b></div><div class="line"><span>Стоимость стены</span><b data-wt="${i}" class="final">${money(c.total)} ₸</b></div>`;walllist.appendChild(d)});calcWalls()}function calcWalls(){let ta=0,tb=0,tc=0,tt=0;walls.forEach((w,i)=>{let c=wallCalc(w);ta+=c.area;tb+=c.base;tc+=c.cut;tt+=c.total;let a=walllist.querySelector(`[data-wa="${i}"]`),t=walllist.querySelector(`[data-wt="${i}"]`);if(a)a.textContent=num(c.area)+' м²';if(t)t.textContent=money(c.total)+' ₸'});$('wallarea').textContent=num(ta)+' м²';$('walltotal').textContent=money(tt)+' ₸';return{area:ta,base:tb,cut:tc,total:tt}}function manualCalc(){let a=safe(area.value),d=Math.min(100,safe(discount.value));localStorage.setItem('m2_discount',d||'');$('areaview').textContent=num(a)+' м²';$('results').innerHTML='';products.forEach((p,i)=>{let base=a*p.price,cut=base*d/100,total=base-cut,r=document.createElement('div');r.className='result';r.innerHTML=`<div class="pname">${esc(p.name)}</div><div class="small">${money(p.price)} ₸ / м²${d?` · скидка ${d}%`:''}</div><div class="line"><span>Итого</span><b class="final">${a&&p.price?money(total)+' ₸':'—'}</b></div><div class="toolbar"><button class="secondary" data-copy="${i}">Скопировать</button><button data-save="${i}">Сохранить</button></div>`;$('results').appendChild(r)})}function textManual(i){let p=products[i],a=safe(area.value),d=Math.min(100,safe(discount.value)),base=a*p.price,cut=base*d/100,total=base-cut,s=['Расчёт заказа','','Площадь: '+num(a)+' м²','Товар: '+p.name,'Цена: '+money(p.price)+' ₸/м²'];if(d){s.push('Скидка: '+d+'%','Сумма скидки: −'+money(cut)+' ₸')}s.push('Итого: '+money(total)+' ₸');return s.join('\n')}function textWalls(snapshot=walls){let s=['Расчёт заказа',''],ta=0,tb=0,tc=0,tt=0;snapshot.forEach((w,i)=>{let p=w.productSnapshot||products[w.product]||{name:'Товар',price:0},a=safe(w.height)*safe(w.width),base=a*safe(p.price),d=Math.min(100,safe(w.discount)),cut=base*d/100,total=base-cut;ta+=a;tb+=base;tc+=cut;tt+=total;s.push(`Стена ${i+1}`,`Высота: ${num(w.height)} м`,`Ширина: ${num(w.width)} м`,`Площадь: ${num(a)} м²`,`Материал: ${p.name}`,`Цена: ${money(p.price)} ₸/м²`);if(d)s.push(`Скидка: ${d}%`,`Сумма скидки: −${money(cut)} ₸`);s.push(`Стоимость: ${money(total)} ₸`,'')});s.push('Общий расчёт','Общая площадь: '+num(ta)+' м²');if(tc)s.push('Общая скидка: −'+money(tc)+' ₸');s.push('Итого: '+money(tt)+' ₸');return s.join('\n')}async function copyText(t){try{await navigator.clipboard.writeText(t);alert('Расчёт скопирован')}catch{let x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();alert('Расчёт скопирован')}}function addHistory(item){let name=prompt('Имя клиента / название расчёта:','Клиент');if(name===null)return;item.id=Date.now();item.name=name.trim()||'Клиент';item.date=new Date().toLocaleString('ru-RU');history.unshift(item);saveHistory();renderHistory();$('historybox').open=true}function renderHistory(){let h=$('history');$('historycount').textContent=history.length?'· '+history.length:'';h.innerHTML=history.length?'':'<div class="small">Пока пусто.</div>';history.forEach((x,i)=>{let d=document.createElement('div');d.className='history',text=x.type==='walls'?textWalls(x.walls):x.text;d.innerHTML=`<b>${esc(x.name)}</b><div class="small">${esc(x.date)}</div><div class="toolbar"><button class="secondary" data-hcopy="${i}">Скопировать</button><button class="danger" data-hdel="${i}">Удалить</button></div>`;h.appendChild(d)})}function sync(){let m=mode.checked;$('manual').classList.toggle('hidden',m);$('manualresults').classList.toggle('hidden',m);$('walls').classList.toggle('hidden',!m);localStorage.setItem('m2_dimension_mode',m?'1':'0');m?calcWalls():manualCalc()}area.oninput=manualCalc;discount.oninput=manualCalc;mode.onchange=sync;$('addwall').onclick=()=>{walls.push({height:0,width:0,product:0,discount:0});saveWalls();renderWalls()};walllist.oninput=e=>{let key=e.target.dataset,idx=key.h??key.w??key.d;if(idx===undefined)return;idx=+idx;if(key.h!==undefined)walls[idx].height=safe(e.target.value);if(key.w!==undefined)walls[idx].width=safe(e.target.value);if(key.d!==undefined)walls[idx].discount=Math.min(100,safe(e.target.value));saveWalls();calcWalls()};walllist.onchange=e=>{if(e.target.dataset.m===undefined)return;walls[+e.target.dataset.m].product=+e.target.value;saveWalls();calcWalls()};walllist.onclick=e=>{let b=e.target.closest('[data-rw]');if(!b)return;walls.splice(+b.dataset.rw,1);if(!walls.length)walls=[{height:0,width:0,product:0,discount:0}];saveWalls();renderWalls()};editor.oninput=()=>{readEditor();manualCalc()};editor.onclick=e=>{let b=e.target.closest('[data-rp]');if(!b)return;readEditor();products.splice(+b.dataset.rp,1);if(!products.length)products=[{name:'Товар 1',price:0}];walls.forEach(w=>w.product=Math.min(w.product,products.length-1));saveProducts();saveWalls();renderEditor();renderWalls();manualCalc()};$('addproduct').onclick=()=>{readEditor();products.push({name:`Товар ${products.length+1}`,price:0});renderEditor()};$('saveproducts').onclick=()=>{readEditor();saveProducts();renderEditor();renderWalls();manualCalc();$('productsbox').open=false};$('results').onclick=e=>{let c=e.target.closest('[data-copy]'),s=e.target.closest('[data-save]');if(c)copyText(textManual(+c.dataset.copy));if(s){let i=+s.dataset.save;addHistory({type:'manual',text:textManual(i)})}};$('walltotal').onclick=()=>{};$('walls').addEventListener('dblclick',()=>{});let copyWallsBtn=document.createElement('div');copyWallsBtn.className='toolbar';copyWallsBtn.innerHTML='<button id="copywalls" class="secondary">Скопировать расчёт</button><button id="savewalls">Сохранить в историю</button>';$('walls').appendChild(copyWallsBtn);$('copywalls').onclick=()=>copyText(textWalls());$('savewalls').onclick=()=>addHistory({type:'walls',walls:walls.map(w=>({...w,productSnapshot:{...products[w.product]}}))});$('history').onclick=e=>{let c=e.target.closest('[data-hcopy]'),d=e.target.closest('[data-hdel]');if(c){let x=history[+c.dataset.hcopy];copyText(x.type==='walls'?textWalls(x.walls):x.text)}if(d&&confirm('Удалить расчёт из истории?')){history.splice(+d.dataset.hdel,1);saveHistory();renderHistory()}};renderEditor();renderWalls();renderHistory();sync();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();</script></body></html>
