<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Калькулятор м²</title><style>:root{--bg:#0d0d0f;--card:#17171b;--card2:#202026;--text:#f5f5f7;--muted:#9a9aa3;--border:#2d2d35;--good:#8ee6a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}main{max-width:720px;margin:auto;padding:18px 0 34px}h1{font-size:28px;margin:0 0 6px}.sub,.small{color:var(--muted);font-size:13px;line-height:1.4}.sub{margin-bottom:18px}.card,.sizecard{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:14px}.sizecard{background:var(--card2);margin:10px 0}.head,.line{display:flex;justify-content:space-between;align-items:center;gap:10px}.line{margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;color:var(--muted);margin:7px 0}input,select{width:100%;min-height:48px;border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:13px;padding:11px;font-size:16px;outline:none}.sizecard input,.sizecard select{background:#17171b}.big{font-size:24px;font-weight:700}.final{color:var(--good);font-size:19px;font-weight:700}.result,.historyrow{padding:13px 0;border-bottom:1px solid var(--border)}.result:last-child,.historyrow:last-child{border:0}.pname{font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:12px;padding:11px 13px;min-height:42px;font-size:14px;font-weight:650;background:#fff;color:#111}.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}.danger{background:transparent;color:#ff8c8c;border:1px solid var(--border)}.hidden{display:none!important}details{border-top:1px solid var(--border);margin-top:12px;padding-top:7px}summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:650}summary::-webkit-details-marker{display:none}.switchrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.switchrow input{width:24px;min-height:24px}.editor{display:grid;grid-template-columns:minmax(0,1fr) 105px 42px;gap:6px;margin:8px 0}.historyrow{cursor:pointer}.historyrow:active{opacity:.7}.detailtop{display:flex;align-items:center;gap:10px;margin-bottom:16px}.detailtop button{padding:8px 11px}.detailitem{background:var(--card2);border-radius:15px;padding:13px;margin:10px 0}.detailitem h3{margin:0 0 10px}.detailtitle{font-size:25px;font-weight:750;margin:0}.count{font-size:12px;color:var(--muted);font-weight:400}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}@media(max-width:430px){.grid2{grid-template-columns:1fr 1fr}.editor{grid-template-columns:minmax(0,1fr) 95px 40px}}</style></head><body><main><div id="appscreen"><h1>Калькулятор м²</h1><div class="sub">Расчёт площади, материалов и стоимости заказа.</div><section class="card"><div id="manual" class="grid2"><div><label>Сколько м² нужно?</label><input id="area" type="number" min="0" step="0.01" inputmode="decimal" placeholder="25"></div><div><label>Скидка, %</label><input id="discount" type="number" min="0" max="100" step="0.1" inputmode="decimal" placeholder="10"></div></div><div id="sizes" class="hidden"><div id="sizelist"></div><button id="addsize" class="secondary">+ Добавить размер</button><div class="line"><span>Общая площадь</span><b id="sizearea">0 м²</b></div><div class="line"><span>Общая стоимость</span><b id="sizetotal" class="final">0 ₸</b></div><div class="toolbar"><button id="copysizes" class="secondary">Скопировать расчёт</button><button id="savesizes">Сохранить в историю</button></div></div><details><summary>Настройки расчёта <span>⌄</span></summary><div class="switchrow"><div><b>Считать по высоте × ширине</b><div class="small">Каждому размеру можно дать название, материал и скидку.</div></div><input id="mode" type="checkbox"></div></details></section><section class="card" id="manualresults"><div class="small">Общая площадь</div><div id="areaview" class="big">0 м²</div><div id="results"></div></section><section class="card"><details id="productsbox"><summary><span>Товары и цены <span id="count" class="count"></span></span><span>⌄</span></summary><div id="editor"></div><div class="toolbar"><button id="addproduct" class="secondary">+ Добавить товар</button><button id="saveproducts">Сохранить</button></div></details></section><section class="card"><div class="head"><b style="font-size:20px">История расчётов</b><span id="historycount" class="count"></span></div><div id="history"></div></section><div class="footer">Данные сохраняются на этом устройстве.</div></div><div id="detailscreen" class="hidden"><div class="detailtop"><button id="back" class="secondary">← Назад</button></div><div id="detailcontent"></div></div></main><script>(()=>{const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n),num=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n),safe=v=>{let n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)?Math.max(0,n):0},esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let products;try{products=JSON.parse(localStorage.getItem('m2_products'))}catch{}if(!Array.isArray(products)||!products.length)products=[{name:'Товар 1',price:18700}];products=products.map((p,i)=>({name:p.name||`Товар ${i+1}`,price:safe(p.price)}));let sizes;try{sizes=JSON.parse(localStorage.getItem('m2_walls_v2'))}catch{}if(!Array.isArray(sizes)||!sizes.length)sizes=[{title:'',height:0,width:0,product:0,discount:0}];sizes=sizes.map(x=>({...x,title:x.title||''}));let history;try{history=JSON.parse(localStorage.getItem('m2_history'))}catch{}if(!Array.isArray(history))history=[];const area=$('area'),discount=$('discount'),mode=$('mode'),sizelist=$('sizelist'),editor=$('editor');mode.checked=localStorage.getItem('m2_dimension_mode')==='1';discount.value=localStorage.getItem('m2_discount')||'';function saveSizes(){localStorage.setItem('m2_walls_v2',JSON.stringify(sizes))}function saveProducts(){localStorage.setItem('m2_products',JSON.stringify(products))}function saveHistory(){localStorage.setItem('m2_history',JSON.stringify(history))}function readEditor(){products=products.map((p,i)=>({name:(editor.querySelector(`[data-n="${i}"]`)?.value||`Товар ${i+1}`).trim()||`Товар ${i+1}`,price:safe(editor.querySelector(`[data-p="${i}"]`)?.value)}))}function renderEditor(){editor.innerHTML='';products.forEach((p,i)=>{let d=document.createElement('div');d.className='editor';d.innerHTML=`<input data-n="${i}" value="${esc(p.name)}"><input data-p="${i}" type="number" inputmode="decimal" value="${p.price||''}" placeholder="₸/м²"><button data-rp="${i}" class="danger">×</button>`;editor.appendChild(d)});$('count').textContent=`· ${products.length}`}function opts(sel){return products.map((p,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(p.name)} — ${money(p.price)} ₸/м²</option>`).join('')}function sizeCalc(x){let a=safe(x.height)*safe(x.width),p=products[x.product]||products[0]||{name:'Товар',price:0},base=a*p.price,d=Math.min(100,safe(x.discount)),cut=base*d/100;return{area:a,p,base,d,cut,total:base-cut}}function renderSizes(){sizelist.innerHTML='';sizes.forEach((x,i)=>{let c=sizeCalc(x),d=document.createElement('div');d.className='sizecard';d.innerHTML=`<div class="head"><b data-head="${i}">${esc(x.title.trim()||`Размер ${i+1}`)}</b>${sizes.length>1?`<button class="danger" data-rs="${i}">Удалить</button>`:''}</div><label>Название (необязательно)</label><input data-title="${i}" value="${esc(x.title)}" placeholder="Стена, Потолок, ТВ-зона..."><div class="grid2"><div><label>Высота, м</label><input data-h="${i}" type="number" step="0.01" inputmode="decimal" value="${x.height||''}"></div><div><label>Ширина, м</label><input data-w="${i}" type="number" step="0.01" inputmode="decimal" value="${x.width||''}"></div></div><label>Материал</label><select data-m="${i}">${opts(x.product)}</select><label>Скидка для этого размера, %</label><input data-d="${i}" type="number" min="0" max="100" step="0.1" inputmode="decimal" value="${x.discount||''}" placeholder="0"><div class="line small"><span>Площадь</span><b data-sa="${i}">${num(c.area)} м²</b></div><div class="line"><span>Стоимость</span><b data-st="${i}" class="final">${money(c.total)} ₸</b></div>`;sizelist.appendChild(d)});calcSizes()}function calcSizes(){let a=0,cut=0,total=0;sizes.forEach((x,i)=>{let c=sizeCalc(x);a+=c.area;cut+=c.cut;total+=c.total;let ae=sizelist.querySelector(`[data-sa="${i}"]`),te=sizelist.querySelector(`[data-st="${i}"]`);if(ae)ae.textContent=num(c.area)+' м²';if(te)te.textContent=money(c.total)+' ₸'});$('sizearea').textContent=num(a)+' м²';$('sizetotal').textContent=money(total)+' ₸';return{area:a,cut,total}}function manualCalc(){let a=safe(area.value),d=Math.min(100,safe(discount.value));localStorage.setItem('m2_discount',d||'');$('areaview').textContent=num(a)+' м²';$('results').innerHTML='';products.forEach((p,i)=>{let base=a*p.price,cut=base*d/100,total=base-cut,r=document.createElement('div');r.className='result';r.innerHTML=`<div class="pname">${esc(p.name)}</div><div class="small">${money(p.price)} ₸ / м²${d?` · скидка ${d}%`:''}</div><div class="line"><span>Итого</span><b class="final">${a&&p.price?money(total)+' ₸':'—'}</b></div><div class="toolbar"><button class="secondary" data-copy="${i}">Скопировать</button><button data-save="${i}">Сохранить</button></div>`;$('results').appendChild(r)})}function manualSnapshot(i){let p=products[i],a=safe(area.value),d=Math.min(100,safe(discount.value)),base=a*p.price,cut=base*d/100;return{type:'manual',area:a,discount:d,product:{...p},total:base-cut}}function textManual(x){let base=x.area*x.product.price,cut=base*x.discount/100,s=['Расчёт заказа','','Площадь: '+num(x.area)+' м²','Материал: '+x.product.name,'Цена: '+money(x.product.price)+' ₸/м²'];if(x.discount)s.push('Скидка: '+x.discount+'%','Сумма скидки: −'+money(cut)+' ₸');s.push('Итого: '+money(x.total)+' ₸');return s.join('\n')}function sizeSnapshot(){return{type:'sizes',sizes:sizes.map(x=>({...x,productSnapshot:{...(products[x.product]||products[0])}})),...calcSizes()}}function textSizes(x){let list=x.sizes||x.walls||[],s=['Расчёт заказа',''],ta=0,tc=0,tt=0;list.forEach((w,i)=>{let p=w.productSnapshot||products[w.product]||{name:'Товар',price:0},a=safe(w.height)*safe(w.width),base=a*safe(p.price),d=Math.min(100,safe(w.discount)),cut=base*d/100,total=base-cut,title=(w.title||'').trim()||`Размер ${i+1}`;ta+=a;tc+=cut;tt+=total;s.push(title,`Высота: ${num(w.height)} м`,`Ширина: ${num(w.width)} м`,`Площадь: ${num(a)} м²`,`Материал: ${p.name}`,`Цена: ${money(p.price)} ₸/м²`);if(d)s.push(`Скидка: ${d}%`,`Сумма скидки: −${money(cut)} ₸`);s.push(`Стоимость: ${money(total)} ₸`,'')});s.push('Общий расчёт','Общая площадь: '+num(ta)+' м²');if(tc)s.push('Общая скидка: −'+money(tc)+' ₸');s.push('Итого: '+money(tt)+' ₸');return s.join('\n')}async function copyText(t){try{await navigator.clipboard.writeText(t)}catch{let x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}alert('Расчёт скопирован')}function addHistory(item){let n=prompt('Имя клиента / название расчёта:','Клиент');if(n===null)return;item.id=Date.now();item.name=n.trim()||'Клиент';item.date=new Date().toLocaleString('ru-RU');history.unshift(item);saveHistory();renderHistory()}function normalizeHistory(x){if(x.type==='walls')return{...x,type:'sizes',sizes:x.walls};if(x.type==='manual'&&x.text&&!x.product)return x;return x}function summaryOf(x){x=normalizeHistory(x);if(x.type==='sizes'){let list=x.sizes||[],a=0,t=0;list.forEach(w=>{let p=w.productSnapshot||products[w.product]||{price:0},ar=safe(w.height)*safe(w.width),base=ar*safe(p.price);a+=ar;t+=base-base*Math.min(100,safe(w.discount))/100});return{area:a,total:t}}if(x.product)return{area:x.area,total:x.total};return{area:null,total:null}}function renderHistory(){let h=$('history');$('historycount').textContent=history.length?'· '+history.length:'';h.innerHTML=history.length?'':'<div class="small" style="margin-top:12px">Пока пусто.</div>';history.forEach((raw,i)=>{let x=normalizeHistory(raw),s=summaryOf(x),d=document.createElement('div');d.className='historyrow';d.dataset.open=i;d.innerHTML=`<div class="head"><div><div class="pname">${esc(x.name||'Расчёт')}</div><div class="small">${esc(x.date||'')}</div></div><b>›</b></div>${s.area!==null?`<div class="small" style="margin-top:6px">${num(s.area)} м² · ${money(s.total)} ₸</div>`:''}`;h.appendChild(d)})}function showDetail(i){let x=normalizeHistory(history[i]);if(!x)return;let s=summaryOf(x),html=`<div class="detailtitle">${esc(x.name||'Расчёт')}</div><div class="sub">${esc(x.date||'')}</div>`;if(x.type==='sizes'){let list=x.sizes||[];list.forEach((w,j)=>{let p=w.productSnapshot||products[w.product]||{name:'Товар',price:0},a=safe(w.height)*safe(w.width),base=a*safe(p.price),disc=Math.min(100,safe(w.discount)),cut=base*disc/100,total=base-cut,title=(w.title||'').trim()||`Размер ${j+1}`;html+=`<div class="detailitem"><h3>${esc(title)}</h3><div class="line"><span>Высота</span><b>${num(w.height)} м</b></div><div class="line"><span>Ширина</span><b>${num(w.width)} м</b></div><div class="line"><span>Площадь</span><b>${num(a)} м²</b></div><div class="line"><span>Материал</span><b>${esc(p.name)}</b></div><div class="line"><span>Цена</span><b>${money(p.price)} ₸/м²</b></div>${disc?`<div class="line"><span>Скидка</span><b>${disc}%</b></div><div class="line"><span>Сумма скидки</span><b>−${money(cut)} ₸</b></div>`:''}<div class="line"><span>Стоимость</span><b class="final">${money(total)} ₸</b></div></div>`})}else if(x.product){let base=x.area*x.product.price,cut=base*x.discount/100;html+=`<div class="detailitem"><div class="line"><span>Площадь</span><b>${num(x.area)} м²</b></div><div class="line"><span>Материал</span><b>${esc(x.product.name)}</b></div><div class="line"><span>Цена</span><b>${money(x.product.price)} ₸/м²</b></div>${x.discount?`<div class="line"><span>Скидка</span><b>${x.discount}%</b></div><div class="line"><span>Сумма скидки</span><b>−${money(cut)} ₸</b></div>`:''}</div>`}else html+=`<div class="detailitem"><div class="small">Старый сохранённый расчёт. Его можно скопировать, но данные для загрузки в калькулятор в старой записи отсутствуют.</div></div>`;if(s.area!==null)html+=`<div class="card"><div class="line"><span>Общая площадь</span><b>${num(s.area)} м²</b></div><div class="line"><span>Итого</span><b class="final">${money(s.total)} ₸</b></div></div>`;html+=`<div class="toolbar"><button data-dload="${i}" ${(!x.product&&x.type!=='sizes')?'disabled':''}>Загрузить расчёт</button><button class="secondary" data-dcopy="${i}">Скопировать</button><button class="danger" data-ddel="${i}">Удалить</button></div>`;$('detailcontent').innerHTML=html;$('appscreen').classList.add('hidden');$('detailscreen').classList.remove('hidden');window.scrollTo(0,0)}function closeDetail(){$('detailscreen').classList.add('hidden');$('appscreen').classList.remove('hidden');window.scrollTo(0,document.body.scrollHeight)}function loadHistory(i){let x=normalizeHistory(history[i]);if(x.type==='sizes'){let list=x.sizes||[];sizes=list.map(w=>{let saved=w.productSnapshot||{},pi=products.findIndex(p=>p.name===saved.name);return{title:w.title||'',height:safe(w.height),width:safe(w.width),discount:Math.min(100,safe(w.discount)),product:pi>=0?pi:0}});if(!sizes.length)sizes=[{title:'',height:0,width:0,product:0,discount:0}];mode.checked=true;saveSizes();renderSizes()}else if(x.product){area.value=x.area||'';discount.value=x.discount||'';mode.checked=false}sync();closeDetail();window.scrollTo(0,0)}function sync(){let m=mode.checked;$('manual').classList.toggle('hidden',m);$('manualresults').classList.toggle('hidden',m);$('sizes').classList.toggle('hidden',!m);localStorage.setItem('m2_dimension_mode',m?'1':'0');m?calcSizes():manualCalc()}area.oninput=manualCalc;discount.oninput=manualCalc;mode.onchange=sync;$('addsize').onclick=()=>{sizes.push({title:'',height:0,width:0,product:0,discount:0});saveSizes();renderSizes()};sizelist.oninput=e=>{let k=e.target.dataset;if(k.title!==undefined){let i=+k.title;sizes[i].title=e.target.value;saveSizes();let h=sizelist.querySelector(`[data-head="${i}"]`);if(h)h.textContent=e.target.value.trim()||`Размер ${i+1}`;return}let idx=k.h??k.w??k.d;if(idx===undefined)return;idx=+idx;if(k.h!==undefined)sizes[idx].height=safe(e.target.value);if(k.w!==undefined)sizes[idx].width=safe(e.target.value);if(k.d!==undefined)sizes[idx].discount=Math.min(100,safe(e.target.value));saveSizes();calcSizes()};sizelist.onchange=e=>{if(e.target.dataset.m===undefined)return;sizes[+e.target.dataset.m].product=+e.target.value;saveSizes();calcSizes()};sizelist.onclick=e=>{let b=e.target.closest('[data-rs]');if(!b)return;sizes.splice(+b.dataset.rs,1);if(!sizes.length)sizes=[{title:'',height:0,width:0,product:0,discount:0}];saveSizes();renderSizes()};editor.oninput=()=>{readEditor();manualCalc()};editor.onclick=e=>{let b=e.target.closest('[data-rp]');if(!b)return;readEditor();products.splice(+b.dataset.rp,1);if(!products.length)products=[{name:'Товар 1',price:0}];sizes.forEach(x=>x.product=Math.min(x.product,products.length-1));saveProducts();saveSizes();renderEditor();renderSizes();manualCalc()};$('addproduct').onclick=()=>{readEditor();products.push({name:`Товар ${products.length+1}`,price:0});renderEditor()};$('saveproducts').onclick=()=>{readEditor();saveProducts();renderEditor();renderSizes();manualCalc();$('productsbox').open=false};$('results').onclick=e=>{let c=e.target.closest('[data-copy]'),s=e.target.closest('[data-save]');if(c)copyText(textManual(manualSnapshot(+c.dataset.copy)));if(s)addHistory(manualSnapshot(+s.dataset.save))};$('copysizes').onclick=()=>copyText(textSizes(sizeSnapshot()));$('savesizes').onclick=()=>addHistory(sizeSnapshot());$('history').onclick=e=>{let r=e.target.closest('[data-open]');if(r)showDetail(+r.dataset.open)};$('back').onclick=closeDetail;$('detailcontent').onclick=e=>{let l=e.target.closest('[data-dload]'),c=e.target.closest('[data-dcopy]'),d=e.target.closest('[data-ddel]');if(l)loadHistory(+l.dataset.dload);if(c){let x=normalizeHistory(history[+c.dataset.dcopy]);copyText(x.type==='sizes'?textSizes(x):x.product?textManual(x):x.text||'')}if(d&&confirm('Удалить этот расчёт?')){history.splice(+d.dataset.ddel,1);saveHistory();renderHistory();closeDetail()}};renderEditor();renderSizes();renderHistory();sync();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();</script></body></html>
