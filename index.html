<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Калькулятор м²</title>
<style>
:root{--bg:#0d0d0f;--card:#17171b;--card2:#202026;--text:#f5f5f7;--muted:#9a9aa3;--border:#303038;--red:#ff6868}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh}.locked body{overflow:hidden}#accessGate{position:fixed;z-index:9999;inset:0;background:var(--bg);display:flex;justify-content:center;overflow:auto;padding:calc(32px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}.gatewrap{width:min(430px,100%);margin:auto}.gatelogo{width:64px;height:64px;border-radius:20px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;margin-bottom:22px}#gateTitle{font-size:30px;margin:0 0 8px}.gatesub{color:var(--muted);line-height:1.45;margin-bottom:24px}#gateBody input{width:100%;height:52px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:14px;padding:0 14px;font-size:16px;outline:none;margin-bottom:10px}#gateBody button{width:100%;min-height:50px;border:0;border-radius:14px;padding:11px 14px;font-size:15px;font-weight:700;margin-top:8px}.gateprimary{background:#fff;color:#111}.gatelink{background:transparent!important;color:var(--muted)!important}.gateerror{color:#ff8c8c;font-size:13px;margin-top:10px}.waitdot{text-align:center;font-size:34px;letter-spacing:7px;color:var(--muted);padding:10px}.accesslist{margin-top:4px}.accessrow{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:14px;margin-bottom:10px}.accessmeta{font-size:12px;color:var(--muted);margin-top:5px}.accessactions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}.accessactions button{width:auto!important;min-height:40px!important;margin:0!important;padding:9px 12px!important}.accessactions .secondary{background:var(--card2)!important;color:var(--text)!important;border:1px solid var(--border)!important}.accessactions .danger{background:rgba(255,80,80,.08)!important;color:var(--red)!important;border:1px solid rgba(255,104,104,.28)!important}.emptyaccess,.gateload{text-align:center;color:var(--muted);padding:25px 5px}
</style>
</head>
<body>
<script>
window.__loadCalculator=async function(){
  try{
    const r=await fetch('https://raw.githubusercontent.com/kdamir411-afk/m2-mobile-calculator/b6799217619d0fab7a2925aa1538deefbab11ba4/index.html',{cache:'no-store'});
    if(!r.ok)throw new Error('load');
    let html=await r.text();
    html=html.replace('placeholder="Например: Дамир 6303"','placeholder=""');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div style="padding:30px;color:#fff;font-family:-apple-system,sans-serif">Не удалось загрузить калькулятор. Проверьте интернет и откройте приложение снова.</div>'}
};
document.addEventListener('m2-access-granted',()=>window.__loadCalculator(),{once:true});
const protectAdminUI=()=>{
  document.querySelectorAll('#adminOpen').forEach(b=>{if(b.textContent!=='Вход')b.textContent='Вход'});
  const u=document.getElementById('adminUser');if(u&&u.value==='damir')u.value='';
};
new MutationObserver(protectAdminUI).observe(document.documentElement,{childList:true,subtree:true});
</script>
<script src="access.js?v=2"></script>
</body>
</html>
